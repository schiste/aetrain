name: Feature request
description: Propose a focused improvement to the prototype or repo workflow.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for concrete feature ideas.

        For open-ended questions or early discussion, use GitHub Discussions
        instead of filing an issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you continue
      options:
        - label: I searched existing issues and discussions first.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - apps/web prototype
        - data or routing model
        - docs or contributor workflow
        - scripts or tooling
        - something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start with the user or maintainer need, not the solution.
      placeholder: Planning a multi-stop trip is hard because...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful improvement you have in mind.
      placeholder: Add a way to filter candidate detours by maximum leg duration...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, rejected ideas, or current workarounds.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Success criteria
      description: How would we know this feature is complete and useful?
      placeholder: |
        - Users can...
        - The prototype should...
        - Docs should mention...
      render: markdown
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, prior art, or implementation notes.
    validations:
      required: false
