name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel in-flight runs for the same ref so a fresh push supersedes its
# predecessors. Saves runner minutes and surfaces the latest signal faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warn-only for now)
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  web-static:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The routing wasm crate's pkg/ is gitignored, so both tsc (the wasm glue
      # module's type declarations) and vite (the glue module itself) fail to
      # resolve it unless we generate it first. Must run before Type check —
      # the earliest consumer. Shared with the prod Cloudflare build
      # (scripts/build-for-pages.sh); the script self-locates the repo root, so
      # the job's apps/web working-directory is irrelevant — invoke by absolute
      # path.
      - name: Build routing WASM
        run: bash "${GITHUB_WORKSPACE}/scripts/build-wasm.sh"

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (node --test)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle size budget (initial JS gzipped <= 80 KB)
        run: |
          set -euo pipefail
          INITIAL_JS=$(ls dist/assets/index-*.js | head -n 1)
          if [ -z "$INITIAL_JS" ]; then
            echo "::error::Could not locate initial JS bundle in dist/assets/"
            exit 1
          fi
          GZ_BYTES=$(gzip -c "$INITIAL_JS" | wc -c | tr -d ' ')
          BUDGET_BYTES=$((80 * 1024))
          echo "Initial JS gzipped: ${GZ_BYTES} bytes (budget ${BUDGET_BYTES})"
          if [ "$GZ_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Initial JS gzipped (${GZ_BYTES} B) exceeds budget (${BUDGET_BYTES} B). See docs/architecture/performance-budgets.md."
            exit 1
          fi

      - name: Upload dist artifacts (for downstream e2e job)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  web-e2e:
    name: Web (Playwright smoke)
    runs-on: ubuntu-latest
    needs: web-static
    defaults:
      run:
        working-directory: apps/web
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore prebuilt dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies (cached browsers path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright (${{ matrix.project }})
        # Exclude visual-regression.spec.ts — its baselines are platform-
        # suffixed and live in their own job (visual-regression.yml) so a
        # pixel diff cannot block the smoke build. Fault-injection and
        # the WASM/golden-path/component suites stay in the matrix.
        run: npx playwright test --project=${{ matrix.project }} --grep-invert "visual regression"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
