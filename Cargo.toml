[workspace]
members = [
  "packages/rust/aetrain-dataset",
  "packages/rust/aetrain-domain",
  "packages/rust/aetrain-normalize",
  "packages/rust/aetrain-pipeline",
  "packages/rust/aetrain-registry",
  "packages/rust/aetrain-routing",
  "packages/rust/aetrain-routing-wasm",
  "packages/rust/aetrain-urlstate",
  "packages/rust/aetrain-wikidata",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.92"
version = "0.1.0"

# Optimised release profile for the wasm-pack output. Lives at the
# workspace root because Cargo ignores `[profile.*]` declared in
# non-root member crates.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
