dataset_id = "stage1-europe-gtfs"
schema_version = 1
description = "Direct GTFS seed feeds discovered during the Europe rail onboarding pass. These records stay inactive until endpoint and rail-scope validation are complete."
default_target_id = "europe-validated"

[[target]]
id = "sncf-fr"
adapter = "sncf_fr"
source_ids = ["sncf-fr-gtfs", "sncf-fr-stations", "sncf-fr-rfn-lines"]
active = true
canonical_export = true
web_debug_export = false
notes = "Official SNCF Stage 1 target with rail-geometry fallback. Included here so the Europe aggregate can build from one manifest."

[[target]]
id = "europe-validated"
adapter = "aggregate_bundle"
source_ids = []
input_target_ids = [
  "sncf-fr",
  "lu-national",
  "be-national",
  "nl-national",
  "at-national",
  "de-national",
  "ch-national",
  "es-renfe-mainline",
  "es-renfe-cercanias",
]
active = true
canonical_export = true
web_debug_export = true
registry_overlay_path = "../registry/fixtures/fr-wikidata-27/canonical/bundle.json"
geometry_authority_registry_path = "geometry-authorities.toml"
notes = "Aggregate Europe target built from the currently validated national rail targets."

[[target]]
id = "europe-customer-facing"
adapter = "aggregate_bundle"
source_ids = []
input_target_ids = [
  "sncf-fr",
  "lu-national",
  "be-national",
  "nl-national",
  "at-national",
  "de-national",
  "ch-national",
  "es-renfe-mainline",
  "es-renfe-cercanias",
]
active = true
canonical_export = true
web_debug_export = false
customer_facing_scope_only = true
registry_overlay_path = "../registry/fixtures/fr-wikidata-27/canonical/bundle.json"
geometry_authority_registry_path = "geometry-authorities.toml"
notes = "Release-scope aggregate. Exports only countries and corridors explicitly marked customer-facing in the authority registry."

