dataset_id = "stage1-europe-gtfs"
schema_version = 1
description = "Direct GTFS seed feeds discovered during the Europe rail onboarding pass. These records stay inactive until endpoint and rail-scope validation are complete."
default_target_id = "europe-validated"

[[target]]
id = "sncf-fr"
adapter = "sncf_fr"
source_ids = ["sncf-fr-gtfs", "sncf-fr-stations", "sncf-fr-rfn-lines"]
active = true
canonical_export = true
web_debug_export = false
notes = "Official SNCF Stage 1 target with rail-geometry fallback. Included here so the Europe aggregate can build from one manifest."

[[target]]
id = "europe-validated"
adapter = "aggregate_bundle"
source_ids = []
input_target_ids = [
  "sncf-fr",
  "lu-national",
  "at-national",
  "de-national",
  "ch-national",
  "es-renfe-mainline",
  "es-renfe-cercanias",
]
active = true
canonical_export = true
web_debug_export = true
notes = "Aggregate Europe target built from the currently validated national rail targets."

[[target]]
id = "ee-national"
adapter = "gtfs_basic"
source_ids = ["ee-peatus-gtfs"]
active = false
canonical_export = true
web_debug_export = false
notes = "Inactive: the historical peatus.ee gtfs.zip endpoint returned a shutdown HTML page during live validation on 2026-05-08."

[[target]]
id = "lt-national"
adapter = "gtfs_basic"
source_ids = ["lt-ltsa-gtfs"]
active = false
canonical_export = true
web_debug_export = false
notes = "Inactive: the verified LTSA archive fetches successfully, but it yielded zero rail artifacts under the current rail-only filtering rules."

[[target]]
id = "lu-national"
adapter = "gtfs_basic"
source_ids = ["lu-atp-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Luxembourg national GTFS resolved through the official data.public.lu dataset API."

[[target]]
id = "at-national"
adapter = "gtfs_basic"
source_ids = ["at-oebb-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Austria national heavy-rail GTFS published by ÖBB as an official static ZIP. Validated on 2026-05-09 after adding support for nested GTFS archive roots."

[[target]]
id = "de-national"
adapter = "gtfs_basic"
source_ids = ["de-delfi-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Official Germany-wide DELFI GTFS resolved from the archive directory listing and validated on 2026-05-09."

[[target]]
id = "ch-national"
adapter = "gtfs_basic"
source_ids = ["ch-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Switzerland GTFS resolved from the public opentransportdata dataset page and validated on 2026-05-09. The host issues short-lived signed download redirects, so unattended fetches need a redirect-aware download path."

[[target]]
id = "no-national"
adapter = "gtfs_basic"
source_ids = ["no-entur-gtfs"]
active = false
canonical_export = true
web_debug_export = false
notes = "Inactive after live validation on 2026-05-09: the documented Current_latest-gtfs.zip URL is an official GTFS stop dump, not a national timetable feed."

[[target]]
id = "es-renfe-mainline"
adapter = "gtfs_basic"
source_ids = ["es-renfe-mainline-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Spain official Renfe GTFS for high-speed, long-distance, and medium-distance services. Validated on 2026-05-09."

[[target]]
id = "es-renfe-cercanias"
adapter = "gtfs_basic"
source_ids = ["es-renfe-cercanias-gtfs"]
active = true
canonical_export = true
web_debug_export = false
notes = "Spain official Renfe GTFS for Cercanías and Rodalies services. Validated on 2026-05-09 after adding CSV trimming for padded official headers/values."

[[source]]
id = "sncf-fr-gtfs"
kind = "gtfs"
country_code = "FR"
adapter = "sncf_fr"
role = "schedule"
url = "https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip"
file_name = "sncf-fr-gtfs.zip"
active = true
include_service_classes = ["intercity", "regional"]
notes = "Official SNCF GTFS static feed for the next 151 days."

[[source]]
id = "sncf-fr-stations"
kind = "supplementary"
country_code = "FR"
adapter = "sncf_fr"
role = "stations_reference"
url = "https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/gares-de-voyageurs/exports/csv?limit=-1&timezone=Europe%2FParis&delimiter=%2C"
file_name = "sncf-fr-stations.csv"
version_probe_url = "https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/gares-de-voyageurs"
active = true
include_service_classes = ["intercity", "regional"]
notes = "Official SNCF passenger-station reference export with UIC codes and coordinates."

[[source]]
id = "sncf-fr-rfn-lines"
kind = "supplementary"
country_code = "FR"
