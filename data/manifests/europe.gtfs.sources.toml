version_probe_url = "https://data.sncf.com/api/explore/v2.1/catalog/datasets/formes-des-lignes-du-rfn"
active = true
include_service_classes = ["intercity", "regional"]
notes = "Official SNCF RFN exploited-line geometry export used as route-shape fallback when GTFS does not include shapes.txt."

