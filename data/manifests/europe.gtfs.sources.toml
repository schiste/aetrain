[[source]]
id = "lu-atp-gtfs"
kind = "gtfs"
country_code = "LU"
adapter = "gtfs_basic"
url = "https://data.public.lu/api/1/datasets/horaires-et-arrets-des-transport-publics-gtfs/"
file_name = "lu-atp-gtfs.zip"
active = true
role = "schedule"
resolver = { kind = "udata_latest_resource", dataset_api_url = "https://data.public.lu/api/1/datasets/horaires-et-arrets-des-transport-publics-gtfs/", format = "zip", title_pattern = '^gtfs-.*\.zip$' }
include_service_classes = ["intercity", "regional", "ferry"]
notes = "Official Luxembourg GTFS feed resolved through the data.public.lu dataset API."

[[source]]
id = "at-oebb-gtfs"
kind = "gtfs"
country_code = "AT"
adapter = "gtfs_basic"
url = "https://static.web.oebb.at/open-data/soll-fahrplan-gtfs/GTFS_Fahrplan_2026.zip"
file_name = "at-oebb-gtfs.zip"
active = true
role = "schedule"
include_service_classes = ["intercity", "regional"]
notes = "Official ÖBB GTFS static export for the 2025/2026 timetable period. The archive is rooted under a top-level folder and is now handled generically."

[[source]]
id = "de-delfi-gtfs"
kind = "gtfs"
country_code = "DE"
adapter = "gtfs_basic"
url = "https://archiv.opendata-oepnv.de/DELFI/Soll-Fahrplandaten%20%28GTFS%29/"
file_name = "de-delfi-gtfs.zip"
active = true
role = "schedule"
resolver = { kind = "directory_listing_cascade", index_url = "https://archiv.opendata-oepnv.de/DELFI/Soll-Fahrplandaten%20%28GTFS%29/", steps = [{ href_pattern = '^20\d{2}/$' }, { href_pattern = '.*\.zip$' }] }
include_service_classes = ["intercity", "regional", "ferry"]
notes = "Official Germany-wide GTFS archive resolved from the DELFI directory listing."

[[source]]
id = "ch-gtfs"
kind = "gtfs"
country_code = "CH"
